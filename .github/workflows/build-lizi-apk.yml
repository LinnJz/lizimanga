name: build-lizi-apk

on:
  push:
    branches: [main, master]
    paths:
      - "mihon-extension-lizi-main/**"
      - ".github/workflows/build-lizi-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mihon-extension-lizi-main
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + install platform 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :assembleRelease --stacktrace --no-daemon

      - name: Rename APK to repo convention
        run: |
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk/tachiyomi-zh.lizi-v1.6.2.apk"
          ls -lh "$GITHUB_WORKSPACE/apk/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tachiyomi-zh.lizi-v1.6.2
          path: apk/tachiyomi-zh.lizi-v1.6.2.apk
